  <style>
    :root {

      --bg: #f5f7fa;

      --line: #d8dee8;
      --cash: #0f766e;
      --invoice: #365b8c;
      --bad: #b42318;
      --good: #166534;
      --warn-bg: #fff8f1;
      --warn: #9a3412;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); }
    header { padding: 26px clamp(18px, 4vw, 42px) 18px; border-bottom: 1px solid var(--line); background: #fff; }
    h1 { margin: 0; font-size: clamp(24px, 3vw, 36px); line-height: 1.15; letter-spacing: 0; }
    h2 { margin: 0 0 10px; font-size: 18px; letter-spacing: 0; }
    h3 { margin: 0 0 8px; font-size: 15px; letter-spacing: 0; }
    main { padding: 20px clamp(18px, 4vw, 42px) 44px; }
    .sub, .note { color: var(--muted); font-size: 13px; line-height: 1.5; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 14px; }
    button, select { border: 1px solid var(--line); background: #fff; color: var(--ink); min-height: 38px; border-radius: 6px; font: inherit; font-weight: 700; }
    button { padding: 0 14px; cursor: pointer; }
    select { padding: 0 38px 0 12px; }
    button[aria-pressed="true"] { border-color: #111827; box-shadow: inset 0 -3px 0 #111827; }
    .pill { display: inline-flex; align-items: center; min-height: 26px; padding: 0 9px; border: 1px solid #f2c7a7; color: var(--warn); background: var(--warn-bg); border-radius: 999px; font-size: 12px; font-weight: 700; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .metric, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
    .metric { padding: 14px; min-height: 104px; }
    .panel { padding: 14px; overflow: hidden; }
    .label { color: var(--muted); font-size: 12px; font-weight: 800; text-transform: uppercase; }
    .value { margin-top: 8px; font-size: clamp(20px, 2.4vw, 30px); font-weight: 850; white-space: nowrap; }
    .cash { color: var(--cash); }
    .invoice { color: var(--invoice); }
    .negative { color: var(--bad); }
    .positive { color: var(--good); }
    section { margin-top: 18px; }
    .columns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
    .wide { grid-column: 1 / -1; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 9px 8px; border-bottom: 1px solid #e9edf3; text-align: left; vertical-align: top; }
    th { color: var(--muted); background: #f9fafb; font-size: 12px; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    tr.total td { font-weight: 850; background: #fbfcfe; }
    tr.profit td { font-weight: 850; }
    .hidden { display: none; }
    @media (max-width: 1080px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .columns { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      .grid { grid-template-columns: 1fr; }
      .value { white-space: normal; }
      th, td { padding: 8px 6px; font-size: 12px; }
    }
  </style>

      const rows = [];
      rows.push(row([cell("매출 합계"), cell(money(totals.income), true)], "total"));
      for (const item of incomeRows) rows.push(row([cell("  " + item.항목), cell(money(item.금액), true)]));
      rows.push(row([cell("비용 합계"), cell(money(totals.expense), true)], "total"));
      for (const item of expenseRows) rows.push(row([cell("  " + item.항목), cell(money(item.금액), true)]));
      rows.push(row([cell("손익"), cell(money(totals.profit), true)], "profit"));
      if (totals.severance) rows.push(row([cell("퇴직급여 제외 손익"), cell(money(totals.operatingProfit), true)], "profit"));
      return table([{ label: "항목" }, { label: "금액", num: true }], rows);
    }

    function basisMissing(key) {
      return "<section class='panel'><h2>" + basisName(key) + "</h2><p class='note'>이 월은 아직 " + basisName(key) + " 산출물이 없습니다. 해당 월 기준 파일을 만들면 자동으로 월 선택에 쌓입니다.</p></section>";
    }

    function basisView(key) {
      const basis = basisData(key);
      if (!basis) return basisMissing(key);
      const online = channelTotals(basis, "온라인");
      const offline = channelTotals(basis, "오프라인");
      const txRows = (basis.topTransactions || []).slice(0, 18).map((r) => row([
        cell(r.거래일자),
        cell(r.입출구분),
        cell(r.상대명),
        cell(r.채널),
        cell(r.항목),
        cell(money(r.금액), true),
      ]));
      const expenseRows = (basis.expenseSummary || []).slice(0, 18).map((r) => row([
        cell(r.채널),
        cell(r.항목),
        cell(money(r.금액), true),
      ]));
      return "<div>" +
        "<div class='grid'>" +
          metric(basis.label + " 총매출", money(basis.totals.income), key === "cash" ? "cash" : "invoice") +
          metric(basis.label + " 총비용", money(basis.totals.expense), key === "cash" ? "cash" : "invoice") +
          metric(basis.label + " 총손익", money(basis.totals.profit), tone(basis.totals.profit)) +
          metric("퇴직급여 제외 손익", money(basis.totals.operatingProfit), tone(basis.totals.operatingProfit)) +
        "</div>" +
        "<section class='columns'>" +
          "<div class='panel'><h2>온라인 손익표</h2>" + channelStatement(basis, "온라인") + "</div>" +
          "<div class='panel'><h2>오프라인 손익표</h2>" + channelStatement(basis, "오프라인") + "</div>" +
          "<div class='panel'><h2>채널 요약</h2>" + table([{ label: "채널" }, { label: "매출", num: true }, { label: "비용", num: true }, { label: "손익", num: true }], [
            row([cell("온라인"), cell(money(online.income), true), cell(money(online.expense), true), cell(money(online.profit), true)]),
            row([cell("오프라인"), cell(money(offline.income), true), cell(money(offline.expense), true), cell(money(offline.profit), true)]),
            row([cell("합계"), cell(money(basis.totals.income), true), cell(money(basis.totals.expense), true), cell(money(basis.totals.profit), true)], "total"),
          ]) + "</div>" +
          "<div class='panel'><h2>주요 비용</h2>" + table([{ label: "채널" }, { label: "항목" }, { label: "금액", num: true }], expenseRows) + "</div>" +
          "<div class='panel wide'><h2>상위 거래</h2>" + (txRows.length ? table([{ label: "일자" }, { label: "구분" }, { label: "상대/가맹점" }, { label: "채널" }, { label: "항목" }, { label: "금액", num: true }], txRows) : "<p class='note'>이 월은 거래별 basis 파일이 없어 요약만 표시합니다.</p>") + "</div>" +
        "</section>" +
      "</div>";
    }

    function compareTable() {
      const month = monthData();
      const rows = [];
      for (const key of ["cash", "invoice"]) {
        const basis = month.bases[key];
        if (!basis) continue;
        const online = channelTotals(basis, "온라인");
        const offline = channelTotals(basis, "오프라인");
        rows.push(row([
          cell(basis.label),
          cell(money(online.income), true),
          cell(money(online.expense), true),
          cell(money(online.profit), true),
          cell(money(offline.income), true),
          cell(money(offline.expense), true),
          cell(money(offline.profit), true),
          cell(money(basis.totals.profit), true),
        ]));
      }
      return table([
        { label: "기준" },
        { label: "온라인 매출", num: true },
        { label: "온라인 비용", num: true },
        { label: "온라인 손익", num: true },
        { label: "오프라인 매출", num: true },
        { label: "오프라인 비용", num: true },
        { label: "오프라인 손익", num: true },
        { label: "총손익", num: true },
      ], rows);
    }

    function overview() {
      const cash = basisData("cash");
      const invoice = basisData("invoice");
      const primary = invoice || cash;
      const diffExpense = cash && invoice ? invoice.totals.expense - cash.totals.expense : 0;
      const diffProfit = cash && invoice ? invoice.totals.profit - cash.totals.profit : 0;
      return "<div class='grid'>" +
          metric("선택 월", monthData().label, "") +
          metric("표시 기준", cash && invoice ? "현금 / 계산서" : primary ? primary.label : "없음", "") +
          metric("비용 차이", cash && invoice ? money(diffExpense) : "대기", cash && invoice ? "invoice" : "") +
          metric("손익 차이", cash && invoice ? money(diffProfit) : "대기", cash && invoice ? tone(diffProfit) : "") +
        "</div>" +
        "<section class='panel'><h2>온라인/오프라인 손익 비교</h2>" + compareTable() + "</section>" +
        "<section class='columns'>" +
          "<div class='panel'><h2>온라인 손익표</h2>" + (primary ? channelStatement(primary, "온라인") : "") + "</div>" +
          "<div class='panel'><h2>오프라인 손익표</h2>" + (primary ? channelStatement(primary, "오프라인") : "") + "</div>" +
        "</section>";
    }

    function historyView() {
      const rows = DATA.historyRows.map((r) => row([
        cell(r.월),
        cell(r.기준),
        cell(money(r.온라인매출), true),
        cell(money(r.온라인손익), true),
        cell(money(r.오프라인매출), true),
        cell(money(r.오프라인손익), true),
        cell(money(r.총매출), true),
        cell(money(r.총비용), true),
        cell(money(r.총손익), true),
        cell(money(r.퇴직급여제외손익), true),
      ]));
      return "<section class='panel'><h2>월별 매출/손익 금액표</h2>" +
        table([
          { label: "월" },
          { label: "기준" },
          { label: "온라인 매출", num: true },
          { label: "온라인 손익", num: true },
          { label: "오프라인 매출", num: true },
          { label: "오프라인 손익", num: true },
          { label: "총매출", num: true },
          { label: "총비용", num: true },
          { label: "총손익", num: true },
          { label: "퇴직급여 제외", num: true },
        ], rows) +
        "<p class='note'>새 월 산출물이 추가되면 이 표에 월 단위로 계속 누적됩니다.</p></section>";
    }

    function render() {
      document.getElementById("overview").innerHTML = overview();
      document.getElementById("cash").innerHTML = basisView("cash");
      document.getElementById("invoice").innerHTML = basisView("invoice");
      document.getElementById("history").innerHTML = historyView();
      document.getElementById("monthNote").textContent = monthData().note || "정상";
      for (const id of ["overview", "cash", "invoice", "history"]) {
        document.getElementById(id).classList.toggle("hidden", id !== selectedTab);
      }
      for (const button of document.querySelectorAll("button[data-tab]")) {
        button.setAttribute("aria-pressed", String(button.dataset.tab === selectedTab));
      }
    }

    const select = document.getElementById("monthSelect");
    for (const month of DATA.months) {
      const option = document.createElement("option");
      option.value = month.month;
      option.textContent = month.label;
      select.appendChild(option);
    }
    select.value = selectedMonth;
    select.addEventListener("change", () => {
      selectedMonth = select.value;
      render();
    });
    document.getElementById("prevMonth").addEventListener("click", () => {
      const idx = DATA.months.findIndex((m) => m.month === selectedMonth);
      selectedMonth = DATA.months[Math.max(0, idx - 1)].month;
      select.value = selectedMonth;
      render();
    });
    document.getElementById("nextMonth").addEventListener("click", () => {
      const idx = DATA.months.findIndex((m) => m.month === selectedMonth);
      selectedMonth = DATA.months[Math.min(DATA.months.length - 1, idx + 1)].month;
      select.value = selectedMonth;
      render();
    });
    for (const button of document.querySelectorAll("button[data-tab]")) {
      button.addEventListener("click", () => {
        selectedTab = button.dataset.tab;
        render();
      });
    }
    render();
  </script>
</body>
</html>
